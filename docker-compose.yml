services:
  postgres:
    image: postgres:16-alpine
    container_name: field-crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: field_crm
      POSTGRES_PASSWORD: field_crm
      POSTGRES_DB: field_crm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U field_crm -d field_crm"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
